name: Build and release Windows IL2CPP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example v0.1.0 (leave empty for build only)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: unity-windows-il2cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 IL2CPP
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Verify Unity license secrets
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:UNITY_EMAIL)) { $missing += "UNITY_EMAIL" }
          if ([string]::IsNullOrWhiteSpace($env:UNITY_PASSWORD)) { $missing += "UNITY_PASSWORD" }
          if ($missing.Count -gt 0) {
            Write-Error "Missing repository secrets: $($missing -join ', '). Personal license needs UNITY_EMAIL + UNITY_PASSWORD."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-Unity-2022.3.62f2-StandaloneWindows64
          restore-keys: |
            Library-${{ runner.os }}-Unity-2022.3.62f2-StandaloneWindows64

      - name: Cache IL2CPP incremental build (Bee)
        uses: actions/cache@v4
        with:
          path: Library/bee_cache
          key: il2cpp-bee-${{ runner.os }}-Unity-2022.3.62f2-StandaloneWindows64
          restore-keys: |
            il2cpp-bee-${{ runner.os }}-Unity-2022.3.62f2-StandaloneWindows64

      - name: Pre-pull Unity editor image (survives Docker Hub rate limits)
        shell: pwsh
        run: |
          # windows-2022 runners occasionally boot with the docker service
          # not listening yet; wait for the daemon before pulling so a
          # slow boot does not burn every pull attempt against a dead pipe.
          foreach ($i in 1..12) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "docker daemon not up (attempt $i); waiting 10s"
            Start-Sleep -Seconds 10
          }
          $img = "unityci/editor:windows-2022.3.62f2-windows-il2cpp-3"
          # pull from the mirror (no auth.docker.io token round-trip) and
          # retag under the canonical name; fall back to a direct pull.
          $ok = $false
          foreach ($i in 1..4) {
            docker pull "mirror.gcr.io/$img"
            if ($LASTEXITCODE -eq 0) { docker tag "mirror.gcr.io/$img" $img; $ok = $true; break }
            $wait = 30 * $i
            Write-Host "mirror pull attempt $i failed; retrying in $wait s"
            Start-Sleep -Seconds $wait
          }
          if (-not $ok) {
            foreach ($i in 1..4) {
              docker pull $img
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              $wait = 60 * $i
              Write-Host "direct pull attempt $i failed; retrying in $wait s"
              Start-Sleep -Seconds $wait
            }
          }
          if (-not $ok) { Write-Error "could not pull $img from mirror or docker hub"; exit 1 }

      - name: Build Windows player with IL2CPP
        uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f2
          targetPlatform: StandaloneWindows64
          buildName: UmaLive
          buildsPath: build
          allowDirtyBuild: true
          versioning: Semantic

      - name: Build UmaLauncher
        shell: pwsh
        run: |
          $ver = if ("$env:GITHUB_REF" -like "refs/tags/v*") { "$env:GITHUB_REF_NAME".Substring(1) } else { "0.0.0" }
          dotnet publish Tools/UmaLauncher/UmaLauncher.csproj -c Release -r win-x64 --self-contained false -o launcher_out -p:Version=$ver
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "$env:GITHUB_SHA" | Set-Content -Path "launcher_out/build.txt" -NoNewline
          Copy-Item -Path "Tools/UmaLauncher/lang" -Destination "launcher_out/lang" -Recurse -Force

      - name: Package Windows build
        shell: pwsh
        run: |
          # the player folder is copied whole and the junk is subtracted from
          # it. a whitelist was tried first and dropped baselib.dll, which
          # the il2cpp player loads at startup, so the build stopped with
          # 'failed to load il2cpp'. subtracting garbage keeps every native
          # library unity ships, including ones added in future versions.
          $stage = "build/stage_umalive"
          Remove-Item -Path $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $player = "build/StandaloneWindows64"
          Copy-Item -Path "$player/*" -Destination $stage -Recurse -Force

          # drop the debug scaffolding unity adds to every build.
          $garbage_dirs = @(
            "*_BackUpThisFolder_ButDontShipItWithYourGame",
            "*_BurstDebugInformation_DoNotShip*",
            "MonoBleedingEdge"
          )
          foreach ($pattern in $garbage_dirs) {
            Get-ChildItem -Path $stage -Directory -Filter $pattern -Recurse -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

          # the old build left a second data folder and exe under the old
          # product name; the player only reads the one it was built with.
          $current_exe = Get-ChildItem -Path $stage -Filter "*.exe" -File |
            Where-Object { $_.BaseName -eq "UmaLive" } | Select-Object -First 1
          if ($current_exe) {
            $expected_data = $current_exe.BaseName + "_Data"
            Get-ChildItem -Path $stage -Directory -Filter "*_Data" |
              Where-Object { $_.Name -ne $expected_data } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem -Path $stage -Filter "*.exe" -File |
              Where-Object { $_.BaseName -ne $current_exe.BaseName -and $_.Name -ne "UnityCrashHandler64.exe" } |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          Copy-Item -Path "launcher_out/*" -Destination $stage -Recurse -Force

          # the symbol sweep runs last, so the launcher's own debug files go
          # too: they were copied in after the player-only sweep.
          Get-ChildItem -Path $stage -Include "*.pdb", "*.mdb", "*.mv2", "*_s.debug" -Recurse -File -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path "$stage/*" -DestinationPath "UmaLive-Windows-x64.zip" -Force

      - name: Write release digest
        shell: pwsh
        run: |
          $hash = Get-FileHash "UmaLive-Windows-x64.zip" -Algorithm SHA256
          ("{0}  UmaLive-Windows-x64.zip" -f $hash.Hash.ToLower()) | Set-Content -Path "UmaLive-Windows-x64.zip.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmaLive-Windows-x64
          path: |
            UmaLive-Windows-x64.zip
            UmaLive-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/experimental'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/experimental ]]; then
            NAME="experimental"
            gh release delete "$NAME" --yes --cleanup-tag 2>/dev/null || true
            NOTE=$(git log --format='%s' -1 -- . ':!.github')
            gh release create "$NAME" "UmaLive-Windows-x64.zip" "UmaLive-Windows-x64.zip.sha256" --target "$GITHUB_SHA" --prerelease --title "$NAME" --notes "$NOTE"
            # re-assert the prerelease flag so the releases list endpoint agrees even if it drifts.
            gh release edit "$NAME" --prerelease
          else
            gh release create "$RELEASE_TAG" "UmaLive-Windows-x64.zip" "UmaLive-Windows-x64.zip.sha256" --title "$RELEASE_TAG" --notes ""
          fi
