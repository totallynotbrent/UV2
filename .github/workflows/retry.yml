name: Retry failed build

# the windows runner fleet occasionally hands out a VM with a dead
# docker service or a broken mirror pull; those are transient and a
# fresh attempt on a new VM succeeds. this watch job polls the build
# workflow after every run and re-runs the failed jobs up to three
# times before giving up.

on:
  workflow_run:
    workflows: ["Build and release Windows IL2CPP"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Re-run failed jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Count previous attempts
        id: attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          ATTEMPTS=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
            --jq '.run_attempt' 2>/dev/null || echo 1)
          echo "attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"

      - name: Re-run failed jobs
        if: steps.attempts.outputs.attempts < 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "attempt ${{ steps.attempts.outputs.attempts }} failed; re-running failed jobs"
          gh api -X POST "repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun-failed-jobs"

      - name: Report giving up
        if: steps.attempts.outputs.attempts >= 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::run ${{ github.event.workflow_run.id }} failed 3 attempts; needs a human"
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" \
            --jq '.html_url'
